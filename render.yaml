services:
  - type: web
    name: api-monitor-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api

    # NODE_ENV=production below makes npm omit devDependencies, but the
    # build needs them: TypeScript to compile and the Prisma CLI to generate
    # the client and run migrations on start. --include=dev overrides that.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start

    healthCheckPath: /health

    envVars:
      # Pinned so the deployed runtime matches CI rather than drifting with
      # Render's default.
      - key: NODE_VERSION
        value: '24'

      - key: NODE_ENV
        value: production

      # Set in the Render dashboard, not here — they are secrets.
      # Pooled endpoint: what the running app uses.
      - key: DATABASE_URL
        sync: false

      # Direct (non-pooled) endpoint, used only by `prisma migrate deploy`.
      # Migrations take a session-level advisory lock, which a transaction
      # pooler cannot hold. Same string with `-pooler` removed from the host.
      - key: DIRECT_DATABASE_URL
        sync: false

      # Comma-separated. Include the Vercel production domain, and the preview
      # domain if you want previews to be able to call the API.
      - key: CORS_ORIGINS
        sync: false

      # Gates writes. Render generates and stores this; read it from the
      # dashboard when you need to add an endpoint.
      - key: ADMIN_TOKEN
        generateValue: true

      # Alerting. Not enabled on this deployment: with these unset the mail
      # transport is null and alerting is skipped entirely. Checks, incidents
      # and status pages are unaffected.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: DASHBOARD_URL
        sync: false
