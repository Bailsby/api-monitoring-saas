services:
  api:
    build:
      context: ./apps/api
    command: npm run dev
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/monitoring
    depends_on:
      - db

  worker:
    build:
      context: ./apps/api
    # The worker itself is run-once-and-exit; in production a GitHub Actions
    # cron invokes it. This loop is the local stand-in for that scheduler.
    command: sh -c 'while true; do npm run worker; sleep 600; done'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/monitoring
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
    command: npm run dev
    ports:
      - '3001:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      # Server-rendered status pages fetch from inside the network, where
      # localhost is the web container itself rather than the API.
      API_INTERNAL_URL: http://api:3000
      WATCHPACK_POLLING: "true"
    depends_on:
      - api

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
