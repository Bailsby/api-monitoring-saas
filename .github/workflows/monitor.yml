name: Run monitoring checks

# The worker is run-once-and-exit, so this workflow is its scheduler. It does
# double duty: the API is hosted on a free tier that sleeps after 15 minutes
# idle with a slow cold start, and warming it on the same schedule keeps the
# demo from looking broken to anyone who clicks it.
#
# GitHub's scheduler is best-effort, and the docs are explicit that under
# load "some queued jobs may be dropped". At */10 this fired roughly 9
# times a day rather than 144, with no failed or cancelled runs and no
# gaps in run numbering — the triggers were never created at all.
#
# The same docs say high load times "include the start of every hour" and
# advise scheduling "at a different time of the hour". Every schedule this
# repository has used fired on :00, the one minute GitHub names as worst.
# These offsets avoid it, and also avoid :15/:30/:45, which are the next
# most obvious minutes for everyone else to have picked.
#
# If the honoured rate does not improve, the interval is not the variable
# and this needs an external scheduler calling a trigger endpoint.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# A late run must not stack up behind the previous one.
concurrency:
  group: monitoring-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # prisma.config.ts resolves DATABASE_URL eagerly, so every Prisma
    # invocation needs it — including generate, which never connects.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Days of raw check history to keep. Pruning happens in the worker, so
      # this belongs here rather than on the API service. Unset would default
      # to the same 90; it is explicit so the value is visible where it acts.
      RETENTION_DAYS: '90'

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Warm the API
        # Best effort: the checks still matter if the dashboard API is down.
        continue-on-error: true
        run: curl --silent --show-error --max-time 90 "$API_URL/health" || true
        env:
          API_URL: ${{ vars.API_URL }}

      - name: Run checks
        run: npm run worker
