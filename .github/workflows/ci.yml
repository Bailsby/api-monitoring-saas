name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # prisma.config.ts resolves DATABASE_URL eagerly, so it must be set even
    # though nothing here connects to a database. A placeholder is deliberate:
    # if a step ever does try to connect, it should fail loudly rather than
    # quietly reaching a real environment.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # The generated client is not committed, so nothing typechecks without it.
      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # Compiles with the production config, which is what actually ships.
      # Without this CI passes while the deployable build is broken.
      - run: npm run build

  web:
    name: Web — lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
